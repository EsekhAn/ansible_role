---
- name: Ensure Docker, compose plugin and rsync are installed
  ansible.builtin.package:
    name:
      - docker.io
      - rsync
    state: present

- name: Ensure docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Create prod directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/myapp
    - "{{ prod_artifacts_dir }}"

- name: Copy war from build node to prod node via rsync
  ansible.builtin.synchronize:
    src: "{{ build_artifacts_dir }}/app.war"
    dest: "{{ prod_artifacts_dir }}/app.war"
    mode: push
    rsync_opts:
      - "--chmod=F0644"
  delegate_to: "{{ groups['build'][0] }}"

- name: Copy prod compose file from repo
  ansible.builtin.copy:
    src: "/opt/myapp/repo/docker-compose.prod.yml"
    dest: /opt/myapp/docker-compose.yml
    mode: '0644'
    remote_src: yes

- name: Start Tomcat container
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: /opt/myapp
